providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]
nixLibs = ["openssl"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.12.0 --activate",
  "pnpm install --no-frozen-lockfile",
]

[phases.build]
cmds = [
  "pnpm db:generate",
  "pnpm --filter @vp/web build",
]

[start]
cmd = "pnpm db:push --skip-generate && pnpm --filter @vp/web start"
